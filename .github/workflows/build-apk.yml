name: Build Takimaki APK

on:
  push:
    branches:
      - main
      - codex/professional-finalization-20261124
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.35.7

jobs:
  ui-baseline:
    name: UI baseline from main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve the current visual test suite
        run: cp test/layout_regression_test.dart "$RUNNER_TEMP/layout_regression_test.dart"
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Use the same visual test suite against main
        run: cp "$RUNNER_TEMP/layout_regression_test.dart" test/layout_regression_test.dart
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Capture baseline layout checks
        # The baseline is intentionally the pre-fix main branch. It may expose
        # old overflows, but that must not block verification or APK creation
        # for the optimized branch.
        continue-on-error: true
        env:
          TAKIMAKI_CAPTURE: artifacts/ui-before
        run: flutter test
      - name: Upload baseline UI captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Takimaki_UI_Before_1.0.26
          path: artifacts/ui-before
          if-no-files-found: warn
          retention-days: 14
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure private Firebase and Maps values
        # Neither configuration file nor API key belongs in the repository.
        # Both are optional for an offline/debug build, but are injected before
        # compilation whenever the existing project secrets are available.
        env:
          FIREBASE_ANDROID_CONFIG_B64: ${{ secrets.FIREBASE_ANDROID_CONFIG_B64 }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -n "$FIREBASE_ANDROID_CONFIG_B64" ]; then
            printf '%s' "$FIREBASE_ANDROID_CONFIG_B64" | base64 --decode > android/app/google-services.json
          fi
          if [ -n "$GOOGLE_MAPS_API_KEY" ]; then
            sed -i "s|YOUR_GOOGLE_MAPS_API_KEY_HERE|$GOOGLE_MAPS_API_KEY|" android/app/src/main/res/values/google_maps_api.xml
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run Flutter tests and capture layout checks
        env:
          TAKIMAKI_CAPTURE: artifacts/ui-check
        run: flutter test
      - name: Upload UI layout captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Takimaki_UI_Check_1.0.26
          path: artifacts/ui-check
          if-no-files-found: warn
          retention-days: 14
      - name: Build installable debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Takimaki_Debug_1.0.26
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
      - name: Detect persistent test signing key
        id: signing
        env:
          TAKIMAKI_KEYSTORE_B64: ${{ secrets.TAKIMAKI_KEYSTORE_B64 }}
          TAKIMAKI_STORE_PASSWORD: ${{ secrets.TAKIMAKI_STORE_PASSWORD }}
          TAKIMAKI_KEY_ALIAS: ${{ secrets.TAKIMAKI_KEY_ALIAS }}
          TAKIMAKI_KEY_PASSWORD: ${{ secrets.TAKIMAKI_KEY_PASSWORD }}
        run: |
          if [ -n "$TAKIMAKI_KEYSTORE_B64" ] && [ -n "$TAKIMAKI_STORE_PASSWORD" ] && [ -n "$TAKIMAKI_KEY_ALIAS" ] && [ -n "$TAKIMAKI_KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Persistent signing secrets are not configured; debug APK remains available."
          fi
      - name: Prepare persistent test signing key
        if: steps.signing.outputs.available == 'true'
        env:
          TAKIMAKI_KEYSTORE_B64: ${{ secrets.TAKIMAKI_KEYSTORE_B64 }}
        run: |
          echo "$TAKIMAKI_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/takimaki-test.keystore"
      - name: Build Takimaki Test APK
        if: steps.signing.outputs.available == 'true'
        env:
          ORG_GRADLE_PROJECT_takimakiTest: "true"
          TAKIMAKI_KEYSTORE: ${{ runner.temp }}/takimaki-test.keystore
          TAKIMAKI_STORE_PASSWORD: ${{ secrets.TAKIMAKI_STORE_PASSWORD }}
          TAKIMAKI_KEY_ALIAS: ${{ secrets.TAKIMAKI_KEY_ALIAS }}
          TAKIMAKI_KEY_PASSWORD: ${{ secrets.TAKIMAKI_KEY_PASSWORD }}
        run: flutter build apk --release
      - name: Upload signed test APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Takimaki_Teszt_1.0.26
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
